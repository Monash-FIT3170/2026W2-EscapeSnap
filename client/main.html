<head>
  <title>EscapeSnap</title>
  <!-- viewport-fit=cover lets env(safe-area-inset-*) resolve on notched phones,
       which the player screens use to keep controls clear of the home indicator. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            mono: ['"Share Tech Mono"', 'monospace'],
            display: ['Orbitron', 'sans-serif'],
          },
          // App palette. Values are the --es-* custom properties in
          // client/main.css, so a theme only has to redefine those.
          colors: {
            ground: 'rgb(var(--es-ground) / <alpha-value>)',
            panel: 'rgb(var(--es-panel) / <alpha-value>)',
            line: 'rgb(var(--es-line) / <alpha-value>)',
            ink: 'rgb(var(--es-ink) / <alpha-value>)',
            muted: 'rgb(var(--es-muted) / <alpha-value>)',
            dim: 'rgb(var(--es-dim) / <alpha-value>)',
            brand: {
              DEFAULT: 'rgb(var(--es-brand) / <alpha-value>)',
              bright: 'rgb(var(--es-brand-bright) / <alpha-value>)',
            },
            'on-brand': 'rgb(var(--es-on-brand) / <alpha-value>)',
            correct: 'rgb(var(--es-correct) / <alpha-value>)',
            incorrect: 'rgb(var(--es-incorrect) / <alpha-value>)',
          }
        }
      }
    }
  </script>
  <style>
    [data-theme="escapesnap"] {
      color-scheme: dark;
      --b1: 222 15% 4%;
      --b2: 222 15% 7%;
      --b3: 222 15% 10%;
      --bc: 215 20% 90%;
      --p: 0 72% 55%;
      --pc: 0 0% 100%;
      --pf: 0 72% 45%;
      --s: 0 60% 30%;
      --sc: 0 0% 100%;
      --a: 0 72% 45%;
      --ac: 0 0% 100%;
      --n: 222 15% 12%;
      --nc: 215 20% 65%;
      --er: 0 72% 55%;
      --erc: 0 0% 100%;
    }
  </style>
</head>
<body data-theme="escapesnap">
  <div id="app"></div>
</body>
