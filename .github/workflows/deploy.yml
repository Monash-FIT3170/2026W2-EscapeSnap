name: Deploy to Meteor Galaxy

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a deploy that is already talking to Galaxy — a half-finished
# deploy is worse than a queued one.
concurrency:
  group: deploy-galaxy
  cancel-in-progress: false

jobs:
  staging:
    name: Deploy and smoke test staging
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event != 'schedule') ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: staging
      url: https://${{ vars.GALAXY_APP_URL }}

    env:
      GALAXY_APP_URL: ${{ vars.GALAXY_APP_URL }}
      GALAXY_SESSION: ${{ secrets.GALAXY_STAGING_SESSION || secrets.METEOR_STAGING_SESSION_FILE }}
      GEMINI_API_KEY: ${{ secrets.STAGING_GEMINI_API_KEY }}
      MONGO_URL: ${{ secrets.STAGING_MONGO_URL }}

    steps:
      - name: Check out verified commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Validate staging configuration
        shell: bash
        run: |
          if [ -z "$GALAXY_APP_URL" ]; then
            echo "::error::Set the GALAXY_APP_URL variable in the staging environment."
            exit 1
          fi

          if [ -z "$GALAXY_SESSION" ]; then
            echo "::error::Set GALAXY_STAGING_SESSION or METEOR_STAGING_SESSION_FILE in the staging environment."
            exit 1
          fi

          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::Set the STAGING_GEMINI_API_KEY secret in the staging environment."
            exit 1
          fi

          if [ -z "$MONGO_URL" ]; then
            echo "::error::Set the STAGING_MONGO_URL secret in the staging environment."
            exit 1
          fi

          echo "Deploy target: $GALAXY_APP_URL"

      - name: Set up Meteor
        uses: ./.github/actions/setup-meteor

      - name: Write staging credentials
        shell: bash
        run: |
          umask 077
          printf '%s' "$GALAXY_SESSION" > "$RUNNER_TEMP/meteor-session.json"

          jq -n --arg key "$GEMINI_API_KEY" --arg mongo "$MONGO_URL" \
            '{"galaxy.meteor.com": {"env": {"GEMINI_API_KEY": $key, "MONGO_URL": $mongo}}}' \
            > "$RUNNER_TEMP/settings.json"

      - name: Deploy to staging
        shell: bash
        env:
          METEOR_SESSION_FILE: ${{ runner.temp }}/meteor-session.json
          DEPLOY_HOSTNAME: galaxy.meteor.com
        run: |
          meteor deploy "$GALAXY_APP_URL" --settings "$RUNNER_TEMP/settings.json" --deploy-polling-timeout 600000

      - name: Remove staging credentials
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/meteor-session.json" "$RUNNER_TEMP/settings.json"

      - name: Run staging smoke test
        shell: bash
        run: |
          curl --fail --silent --show-error --location \
            --retry 12 --retry-delay 10 --retry-connrefused \
            "https://$GALAXY_APP_URL/" \
            --output "$RUNNER_TEMP/staging-response.html"

          if [ ! -s "$RUNNER_TEMP/staging-response.html" ]; then
            echo "::error::Staging returned an empty response."
            exit 1
          fi

  production:
    name: Deploy and smoke test production
    needs: staging
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Configure required reviewers in Settings > Environments > production
    # to hold the release for manual approval after staging passes.
    environment:
      name: production
      url: https://${{ vars.GALAXY_APP_URL || 'escape-snap.sandbox.galaxycloud.app' }}

    env:
      GALAXY_APP_URL: ${{ vars.GALAXY_APP_URL || 'escape-snap.sandbox.galaxycloud.app' }}
      GALAXY_SESSION: ${{ secrets.GALAXY_SESSION || secrets.METEOR_SESSION_FILE }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      MONGO_URL: ${{ secrets.MONGO_URL }}

    steps:
      - name: Check out verified commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Validate production configuration
        shell: bash
        run: |
          if [ -z "$GALAXY_SESSION" ]; then
            echo "::error::Set the GALAXY_SESSION or METEOR_SESSION_FILE secret in the production environment."
            exit 1
          fi

          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::Set the GEMINI_API_KEY secret in the production environment."
            exit 1
          fi

          if [ -z "$MONGO_URL" ]; then
            echo "::error::Set the MONGO_URL secret in the production environment."
            exit 1
          fi

          echo "Deploy target: $GALAXY_APP_URL"

      - name: Set up Meteor
        uses: ./.github/actions/setup-meteor

      - name: Write production credentials
        shell: bash
        run: |
          umask 077
          printf '%s' "$GALAXY_SESSION" > "$RUNNER_TEMP/meteor-session.json"

          jq -n --arg key "$GEMINI_API_KEY" --arg mongo "$MONGO_URL" \
            '{"galaxy.meteor.com": {"env": {"GEMINI_API_KEY": $key, "MONGO_URL": $mongo}}}' \
            > "$RUNNER_TEMP/settings.json"

      - name: Deploy to production
        shell: bash
        env:
          METEOR_SESSION_FILE: ${{ runner.temp }}/meteor-session.json
          DEPLOY_HOSTNAME: galaxy.meteor.com
        run: |
          meteor deploy "$GALAXY_APP_URL" --settings "$RUNNER_TEMP/settings.json" --deploy-polling-timeout 600000

      - name: Remove production credentials
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/meteor-session.json" "$RUNNER_TEMP/settings.json"

      - name: Run production smoke test
        shell: bash
        run: |
          curl --fail --silent --show-error --location \
            --retry 12 --retry-delay 10 --retry-connrefused \
            "https://$GALAXY_APP_URL/" \
            --output "$RUNNER_TEMP/production-response.html"

          if [ ! -s "$RUNNER_TEMP/production-response.html" ]; then
            echo "::error::Production returned an empty response."
            exit 1
          fi

  report:
    name: Deployment report
    if: always()
    needs:
      - staging
      - production
    runs-on: ubuntu-latest
    steps:
      - name: Summarize deployment results
        env:
          STAGING_RESULT: ${{ needs.staging.result }}
          PRODUCTION_RESULT: ${{ needs.production.result }}
        run: |
          {
            echo "## Deployment pipeline"
            echo
            echo "| Stage | Result |"
            echo "| --- | --- |"
            echo "| Staging deploy and smoke test | $STAGING_RESULT |"
            echo "| Production deploy and smoke test | $PRODUCTION_RESULT |"
          } >> "$GITHUB_STEP_SUMMARY"
