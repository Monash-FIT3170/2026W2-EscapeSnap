name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a deploy that is already talking to Galaxy — a half-finished
# deploy is worse than a queued one.
concurrency:
  group: deploy-galaxy
  cancel-in-progress: false

jobs:
  # Ships main to Meteor Galaxy. Credentials are written to a temporary file
  # for the length of the deploy and removed afterwards, and the production
  # environment gate allows a reviewer to hold the release.
  deploy:
    name: Deploy to Meteor Galaxy
    runs-on: ubuntu-latest
    timeout-minutes: 40

    # Configure required reviewers / secrets on this environment in
    # Settings > Environments > production.
    environment:
      name: production
      url: https://${{ vars.GALAXY_APP_URL || 'escape-snap.sandbox.galaxycloud.app' }}

    env:
      # Defaults to the sandbox domain already deployed from main, so the
      # workflow runs without extra repository configuration.
      GALAXY_APP_URL: ${{ vars.GALAXY_APP_URL || 'escape-snap.sandbox.galaxycloud.app' }}
      # METEOR_SESSION_FILE is the secret name the existing deploy on main
      # uses; accept either so this workflow drops in without a secret rename.
      GALAXY_SESSION: ${{ secrets.GALAXY_SESSION || secrets.METEOR_SESSION_FILE }}
      # Optional: nothing in the app reads Meteor.settings yet.
      GALAXY_METEOR_SETTINGS: ${{ secrets.GALAXY_METEOR_SETTINGS }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate deployment configuration
        shell: bash
        run: |
          if [ -z "$GALAXY_SESSION" ]; then
            echo "::error::No deploy session found. Set the METEOR_SESSION_FILE secret to the contents of ~/.meteorsession after running 'meteor login'."
            exit 1
          fi

          echo "Deploy target: $GALAXY_APP_URL"

      - name: Validate settings JSON
        # Settings are optional: no server code reads Meteor.settings today, so
        # a missing secret must not block the deploy. Validate only if present.
        if: env.GALAXY_METEOR_SETTINGS != ''
        shell: bash
        run: |
          # Parses without printing, so the secret never reaches the log.
          python3 -c 'import json, os; json.loads(os.environ["GALAXY_METEOR_SETTINGS"])'
          echo "Production settings JSON is valid."

      - name: Cache Meteor
        uses: actions/cache@v5
        with:
          path: ~/.meteor
          key: meteor-${{ runner.os }}-${{ hashFiles('.meteor/release') }}
          restore-keys: |
            meteor-${{ runner.os }}-

      - name: Install Meteor
        shell: bash
        run: |
          if [ ! -x "$HOME/.meteor/meteor" ]; then
            curl -fsSL https://install.meteor.com/ | sh
          fi

          echo "$HOME/.meteor" >> "$GITHUB_PATH"
          "$HOME/.meteor/meteor" --version

      - name: Install dependencies
        run: meteor npm ci

      - name: Write deploy credentials
        shell: bash
        run: |
          umask 077
          printf '%s' "$GALAXY_SESSION" > "$RUNNER_TEMP/meteor-session.json"

          if [ -n "$GALAXY_METEOR_SETTINGS" ]; then
            printf '%s' "$GALAXY_METEOR_SETTINGS" > "$RUNNER_TEMP/settings.json"
          fi

      - name: Deploy to Galaxy
        shell: bash
        env:
          METEOR_SESSION_FILE: ${{ runner.temp }}/meteor-session.json
          DEPLOY_HOSTNAME: galaxy.meteor.com
        run: |
          # --deploy-polling-timeout stops the step hanging for the job's full
          # 40 minutes when Galaxy is slow to report the container as ready.
          DEPLOY_ARGS=("$GALAXY_APP_URL" --deploy-polling-timeout 600000)

          if [ -f "$RUNNER_TEMP/settings.json" ]; then
            DEPLOY_ARGS+=(--settings "$RUNNER_TEMP/settings.json")
          else
            echo "::notice::Deploying without a settings file."
          fi

          meteor deploy "${DEPLOY_ARGS[@]}"

      - name: Remove deploy credentials
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/meteor-session.json" "$RUNNER_TEMP/settings.json"
