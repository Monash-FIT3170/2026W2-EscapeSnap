name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: true
  NODE_ENV: test
  PORT: 3000
  ROOT_URL: http://localhost:3000
  MONGO_URL: mongodb://127.0.0.1:27017/escapesnap_test
  # Store private CI settings and API keys in the CI_METEOR_SETTINGS
  # repository secret. Never use production credentials in this workflow.
  METEOR_SETTINGS: ${{ secrets.CI_METEOR_SETTINGS || '{}' }}

jobs:
  # The actual build gate: installs dependencies, lints, runs the test suite
  # against a throwaway MongoDB, and proves the app still bundles. Runs on
  # every trigger, not just PRs, so a broken main is caught immediately.
  verify:
    name: Lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 35

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate environment configuration
        shell: bash
        run: |
          python3 -c 'import json, os; json.loads(os.environ["METEOR_SETTINGS"])'
          echo "CI environment configuration is valid."

      - name: Cache Meteor
        uses: actions/cache@v5
        with:
          path: ~/.meteor
          key: meteor-${{ runner.os }}-${{ hashFiles('.meteor/release') }}
          restore-keys: |
            meteor-${{ runner.os }}-

      - name: Install Meteor
        shell: bash
        run: |
          if [ ! -x "$HOME/.meteor/meteor" ]; then
            curl -fsSL https://install.meteor.com/ | sh
          fi

          echo "$HOME/.meteor" >> "$GITHUB_PATH"
          "$HOME/.meteor/meteor" --version

      - name: Install dependencies
        run: meteor npm ci

      - name: Audit npm dependencies
        run: meteor npm audit --audit-level=high

      - name: Run lint
        run: >-
          meteor npm run lint -- --rule 'prettier/prettier: off'

      - name: Run tests
        shell: bash
        run: |
          TEST_SCRIPT=$(python3 -c "import json; print(json.load(open('package.json')).get('scripts', {}).get('test', ''))")

          if [ -z "$TEST_SCRIPT" ]; then
            echo "::warning::No test script is defined in package.json. Automated tests were skipped."
            exit 0
          fi

          echo "Waiting for MongoDB..."
          for ATTEMPT in {1..30}; do
            if (echo > /dev/tcp/127.0.0.1/27017) >/dev/null 2>&1; then
              echo "MongoDB is ready."
              meteor npm test
              exit $?
            fi

            sleep 1
          done

          echo "::error::MongoDB did not become available on port 27017."
          exit 1

      - name: Build Meteor application
        shell: bash
        run: |
          rm -rf /tmp/escapesnap-build
          meteor build --directory /tmp/escapesnap-build

  code-scan:
    name: Code security scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Analyze code
        uses: github/codeql-action/analyze@v3

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out complete Git history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'

      - name: Install Gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.24.3

      - name: Scan for exposed secrets
        run: gitleaks git --verbose --redact --exit-code 1
