name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  # Weekly run on main so CodeQL and the dependency audit catch newly
  # disclosed vulnerabilities even when nobody is pushing.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: true
  NODE_ENV: test
  PORT: 3000
  ROOT_URL: http://localhost:3000
  MONGO_URL: mongodb://127.0.0.1:27017/escapesnap_test
  # Store private CI settings and API keys in the CI_METEOR_SETTINGS
  # repository secret. Never use production credentials in this workflow.
  METEOR_SETTINGS: ${{ secrets.CI_METEOR_SETTINGS || '{}' }}

jobs:
  # The actual build gate: installs dependencies, lints, runs the test suite
  # against a throwaway MongoDB, and proves the app still bundles. Runs on
  # every trigger, not just PRs, so a broken main is caught immediately.
  verify:
    name: Lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 35

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate environment configuration
        shell: bash
        run: |
          python3 -c 'import json, os; json.loads(os.environ["METEOR_SETTINGS"])'
          echo "CI environment configuration is valid."

      - name: Set up Meteor
        uses: ./.github/actions/setup-meteor

      - name: Audit npm dependencies
        run: meteor npm audit --audit-level=high

      - name: Run lint
        run: >-
          meteor npm run lint -- --rule 'prettier/prettier: off'

      - name: Run tests
        shell: bash
        run: |
          TEST_SCRIPT=$(python3 -c "import json; print(json.load(open('package.json')).get('scripts', {}).get('test', ''))")

          if [ -z "$TEST_SCRIPT" ]; then
            echo "::warning::No test script is defined in package.json. Automated tests were skipped."
            exit 0
          fi

          echo "Waiting for MongoDB..."
          for ATTEMPT in {1..30}; do
            if (echo > /dev/tcp/127.0.0.1/27017) >/dev/null 2>&1; then
              echo "MongoDB is ready."
              meteor npm test
              exit $?
            fi

            sleep 1
          done

          echo "::error::MongoDB did not become available on port 27017."
          exit 1

      # Vitest writes these reports when CI is set (see vitest.config.mjs).
      - name: Publish test summary
        if: always()
        shell: bash
        run: |
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          import xml.etree.ElementTree as ET

          print("## Component tests (Vitest)")
          print()

          junit = ".reports/vitest-junit.xml"
          if os.path.exists(junit):
              root = ET.parse(junit).getroot()
              total = int(root.get("tests", 0))
              failed = int(root.get("failures", 0)) + int(root.get("errors", 0))
              skipped = int(root.get("skipped", 0))
              print("| Tests | Passed | Failed | Skipped |")
              print("| --- | --- | --- | --- |")
              print(f"| {total} | {total - failed - skipped} | {failed} | {skipped} |")
          else:
              print("No Vitest report was produced (an earlier step may have failed).")
          print()

          coverage = ".reports/coverage/coverage-summary.json"
          if os.path.exists(coverage):
              totals = json.load(open(coverage))["total"]
              print("### Coverage")
              print()
              print("| Metric | Covered | Total | % |")
              print("| --- | --- | --- | --- |")
              for metric in ("lines", "statements", "functions", "branches"):
                  m = totals[metric]
                  print(f"| {metric.capitalize()} | {m['covered']} | {m['total']} | {m['pct']}% |")
          EOF

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: .reports/
          retention-days: 7
          if-no-files-found: ignore
          include-hidden-files: true

      - name: Build Meteor application
        shell: bash
        run: |
          rm -rf /tmp/escapesnap-build
          meteor build --directory /tmp/escapesnap-build

  # Blocks PRs that add or upgrade to a dependency with a known HIGH or
  # CRITICAL vulnerability. Unlike npm audit, it only judges what the PR
  # changes, so pre-existing advisories on main don't block unrelated work.
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  code-scan:
    name: Code security scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Analyze code
        uses: github/codeql-action/analyze@v3

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out complete Git history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'

      - name: Install Gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.24.3

      - name: Scan for exposed secrets
        run: gitleaks git --verbose --redact --exit-code 1

  # The single check branch protection should require. It passes only when
  # every job above succeeded or was intentionally skipped, so jobs can be
  # added or renamed without touching the branch protection rules.
  ci-gate:
    name: CI gate
    if: always() && !cancelled()
    needs:
      - verify
      - dependency-review
      - code-scan
      - secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check upstream job results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'

          FAILED=$(echo "$RESULTS" | jq -r \
            'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key')

          if [ -n "$FAILED" ]; then
            echo "::error::These jobs did not pass: $(echo $FAILED)"
            exit 1
          fi

          echo "All CI jobs passed."
